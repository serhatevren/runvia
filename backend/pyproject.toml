[project]
name = "runvia"
version = "0.1.0"
description = "Runvia control plane: the API and worker of a self-hosted PaaS"
authors = [
    { name = "evren", email = "119623591+serhatevren@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.18,<0.13.0"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "ASYNC",    # blocking calls inside async def (spec §3)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "PTH",      # prefer pathlib
    "T20",      # no print()
    "PT",       # pytest style
    "FAST",     # FastAPI
    "RUF",      # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
